<script>
const $=id=>document.getElementById(id);
let D={old:null,nw:null};
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const r=[];let row=[],c='',q=false;
for(let i=0;i<t.length;i++){const ch=t[i];
if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}

else c+=ch}
if(c||row.length){row.push(c);if(row.some(x=>x.trim()))r.push(row)}return r}
function pDate(s){s=(s||'').trim();let m=s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
if(m)return{k:`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`,l:`${m[3].padStart(2,'0')}-${m[2].padStart(2,'0')}-${m[1]}`};
m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
if(m)return{k:`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`,l:`${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}-${m[3]}`};
return null}
function load(text){const rows=parseCSV(text);if(rows.length<2)throw'File is empty';

if([ci,ai,mi].some(i=>i<0))throw'Missing columns. Need: Created At, Agent Name, Booking Amount';

for(const r of rows.slice(1)){const d=pDate(r[ci]);if(!d){skip++;continue}

recs.push({d,a,amt,id:bi>=0?(r[bi]||'').trim().toUpperCase():''})}
const dates=[...new Map(recs.map(x=>[x.d.k,x.d])).values()].sort((x,y)=>x.k<y.k?-1:1);
return{recs,dates,skip,total:rows.length-1,uq:new Set(recs.map(r=>r.id).filter(Boolean)).size}}
function agg(ds){const A={};for(const r of ds.recs){const a=A[r.a]??=(A[r.a]={});const e=a[r.d.k]??=[0,0];e[0]++;e[1]+=r.amt}return A}
const fmt=n=>Number.isInteger(n)?n:(Math.round(n*100)/100);
const inc=(n,o)=>o==0?null:(n-o)/o;
const T='border:1px solid #000;padding:3px 10px;text-align:center;font-family:Calibri,Arial,sans-serif;font-size:14px;';
function ic(v){if(v===null)return`<td style="${T}color:#555">-</td>`;

return`<td style="${T}color:#007a33;background:#c6efce;font-weight:bold">${r.toFixed(2)}</td>`}
function agentTable(name,Ao,An){

function summaryTable(rows){

function wire(fid,key,sid,bid){$(fid).onchange=async e=>{const f=e.target.files[0];if(!f)return;

catch(err){D[key]=null;$(bid).classList.remove('ok');$(sid).textContent='Error';$('msg').textContent=f.name+': '+err}}}
let LAST;
const X=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

rows.forEach((r,ri)=>{x+=`<row r="${ri+1}">`;r.forEach((c,ci)=>{if(!c)return;const ref=colL(ci)+(ri+1),v=c[0],s=c[1];
if(v===null||v==='')x+=`<c r="${ref}" s="${s}"/>`;else if(typeof v==='number')x+=`<c r="${ref}" s="${s}"><v>${v}</v></c>`;else x+=`<c r="${ref}" s="${s}" t="inlineStr"><is><t>${X(v)}</t></is></c>`});x+='</row>'});

function buildXlsx(){const{Ao,An,res}=LAST,od=D.old.dates,nd=D.nw.dates,n=Math.max(od.length,nd.length),R=[],M=[];
for(const r of res){const ao=Ao[r.name]||{},an=An[r.name]||{};R.push([[r.name,11]]);const b=R.length+1;M.push(`A${b}:C${b}`,`D${b}:F${b}`);

function agg(ds){const A={},seen=new Set();for(const r of ds.recs){if(MODE=='uniq'&&r.id){if(seen.has(r.id))continue;seen.add(r.id)}const a=A[r.a]||(A[r.a]={});const e=a[r.d.k]||(a[r.d.k]=[0,0]);e[0]++;e[1]+=r.amt}return A}

function t2s(tbl,rows,merges,r0){const occ={};
[...tbl.rows].forEach((tr,ri)=>{let ci=0;const R=r0+ri;rows[R]=rows[R]||[];
[...tr.cells].forEach(td=>{while(occ[R+','+ci])ci++;const cs=td.colSpan,rs=td.rowSpan,s=sid(td.getAttribute('style')),tx=td.textContent.trim(),v=(tx!==''&&!isNaN(tx))?+tx:tx;
for(let a=0;a<rs;a++)for(let b=0;b<cs;b++){occ[(R+a)+','+(ci+b)]=1;rows[R+a]=rows[R+a]||[];rows[R+a][ci+b]=(a||b)?['',s]:[v,s]}
if(cs>1||rs>1)merges.push(colL(ci)+(R+1)+':'+colL(ci+cs-1)+(R+rs));ci+=cs})});
return r0+tbl.rows.length}
